<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft Game</title><link rel="stylesheet" href="/viewer.css"></head><body><main id="game"><iframe id="pov" src="/pov/" title="Live Minecraft POV"></iframe><div id="loading">LOADING WORLD…</div><div id="crosshair" aria-hidden="true">+</div><header><span id="state">Connecting…</span><span id="forge">Forge: waiting</span></header><aside id="tools"><button id="inventoryButton">Inventory <kbd>E</kbd></button><button id="chatButton">Chat</button><button id="exitLock">Exit mouse</button><button id="fullscreen">Fullscreen</button></aside><section id="chat" hidden><div id="chatLines"></div><form id="chatForm"><input id="chatInput" maxlength="256" placeholder="Type chat, then Enter" autocomplete="off"><button>Send</button></form></section><section id="inventory" hidden><h2>Inventory</h2><p id="inventoryUnavailable">Inventory unavailable until the active client bridge supplies it.</p><div id="inventorySlots"></div></section><footer id="hud"><div id="vitals"><span>❤ <b id="health">—</b></span><span>🍗 <b id="hunger">—</b></span><span>🛡 <b id="armor">—</b></span><span>XP <b id="experience">—</b></span></div><div id="hotbar" aria-label="Hotbar"></div></footer></main><script src="/viewer.js"></script></body></html>
